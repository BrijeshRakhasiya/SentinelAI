services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Leave blank so the frontend calls same-origin relative paths,
        # which nginx.conf proxies to the backend service internally.
        REACT_APP_API_URL: ""
        REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL:-}
        REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${REACT_APP_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
