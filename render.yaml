# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploy both services in one go: Render Dashboard -> New -> Blueprint ->
# select this repo. Render finds this file automatically.
#
# Env vars marked `sync: false` are secrets Render will prompt you for
# once in the dashboard instead of storing them in this file / git.
#
# NOTE: after the first deploy, copy the actual assigned URLs and fill in
# REACT_APP_API_URL (frontend) and CORS_ORIGINS (backend) for real --
# Render appends a random suffix to the hostname if "sentinelai-backend"
# / "sentinelai-frontend" are already taken globally.
#
# IMPORTANT -- SPA routing: the `routes: rewrite` rule below only takes
# effect if this static site was actually created *from this Blueprint*.
# If your live site was created manually via Dashboard -> New -> Static
# Site (names won't match "sentinelai-frontend" if so), Render never reads
# this file for it. In that case add the same rule by hand instead:
# Dashboard -> your static site -> Settings -> Redirects/Rewrites -> Add
# Rule -> Source "/*", Destination "/index.html", Action "Rewrite".
# Render does NOT support a Netlify-style `_redirects` file -- only this
# Dashboard config or a Blueprint `routes` entry works.

services:
  - type: web
    name: sentinelai-backend
    runtime: docker
    repo: https://github.com/BrijeshRakhasiya/SentinelAI
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: USE_CACHE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./sentinelai.db
      - key: ALERT_SOURCE
        # real_world_json is the stable Render default until the Wazuh MCP
        # connector and backend live-ingestion logic are implemented.
        value: real_world_json
      - key: CORS_ORIGINS
        # Update to the frontend's real URL once it's deployed.
        value: https://sentinelai-frontend.onrender.com

  - type: web
    name: sentinelai-frontend
    runtime: static
    repo: https://github.com/BrijeshRakhasiya/SentinelAI
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://sentinelai-9tp4.onrender.com
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
