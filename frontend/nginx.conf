server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy to the backend container by service name -- used when
    # REACT_APP_API_URL is left blank (relative paths) for local
    # `docker compose up`. In production the frontend instead talks
    # directly to REACT_APP_API_URL and this block is unused. Auth is
    # handled entirely by Supabase, called directly from the browser.
    location ~ ^/(api|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # SPA fallback -- client-side routing (React Router) owns everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
